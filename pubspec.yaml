name: cleanova
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_storage: ^13.4.1
  cloud_functions: ^6.3.1

  # Stripe
  flutter_stripe: ^12.6.0

  # Device preview
  device_preview: ^1.3.1

  # Image picker
  image_picker: ^1.1.2

  firebase_messaging: 16.3.0
  flutter_local_notifications: 18.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/image/cleaner_main.png
    - assets/image/deep1_icon.png
    - assets/image/house_icon.png
    - assets/image/office_icon.png
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21